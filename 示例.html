<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BugSeek - 测试脚本管理（分组折叠版）</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f8f9fa;
    }
    .sidebar {
      background-color: #1a1a1a;
      color: white;
      min-height: 100vh;
      width: 250px;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 100;
    }
    .main-content {
      padding: 20px;
      background-color: white;
      margin-left: 270px;
    }
    .group-header {
      background-color: #f1f3f5;
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 12px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      transition: background 0.2s;
    }
    .group-header:hover {
      background-color: #e9ecef;
    }
    .group-body {
      padding: 0 16px 16px 32px;
      border-left: 2px solid #dee2e6;
      margin-bottom: 24px;
    }
    .script-item {
      padding: 10px 0;
      border-bottom: 1px dashed #eee;
    }
    .script-item:last-child {
      border-bottom: none;
    }
    .tag {
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.75rem;
      margin-right: 6px;
    }
    .tag.positive { background-color: #d4edda; color: #155724; }
    .tag.negative { background-color: #f8d7da; color: #721c24; }
    .tag.exception { background-color: #fff3cd; color: #856404; }
    .actions .btn {
      padding: 4px 8px;
      font-size: 0.8rem;
    }
    .status-summary {
      font-size: 0.85rem;
      color: #666;
    }
    .nav-link {
      color: #ccc;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    .nav-link.active {
      background-color: #007bff;
      color: white;
    }
    .nav-link:hover {
      background-color: #2d2d2d;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- 左侧导航 -->
  <nav class="sidebar d-flex flex-column">
    <div class="p-3 text-center">
      <h4 class="text-white mb-0">BugSeek</h4>
    </div>
    <ul class="nav flex-column mt-3 p-3">
      <li class="nav-item"><a href="#" class="nav-link">仪表盘</a></li>
      <li class="nav-item"><a href="#" class="nav-link">项目管理</a></li>
      <li class="nav-item"><a href="#" class="nav-link">需求洞察</a></li>
      <li class="nav-item"><a href="#" class="nav-link">代码质量</a></li>
      <li class="nav-item"><a href="#" class="nav-link">接口集成</a></li>
      <li class="nav-item"><a href="#" class="nav-link">文档管理</a></li>
      <li class="nav-item"><a href="#" class="nav-link active">测试脚本</a></li>
      <li class="nav-item"><a href="#" class="nav-link">场景组装</a></li>
      <li class="nav-item"><a href="#" class="nav-link">Mock 服务</a></li>
      <li class="nav-item"><a href="#" class="nav-link">测试套件</a></li>
      <li class="nav-item"><a href="#" class="nav-link">执行记录</a></li>
      <li class="nav-item"><a href="#" class="nav-link">测试报告</a></li>
    </ul>
  </nav>

  <!-- 主内容区 -->
  <div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4>测试脚本</h4>
      <div class="d-flex gap-2">
        <button class="btn btn-outline-primary btn-sm" onclick="toggleAllGroups(true)">全部展开</button>
        <button class="btn btn-outline-secondary btn-sm" onclick="toggleAllGroups(false)">全部收起</button>
        <button class="btn btn-outline-primary btn-sm">+ 生成脚本</button>
      </div>
    </div>

    <!-- 分组容器 -->
    <div id="scriptGroups"></div>
  </div>

  <script>
    // 模拟数据：按接口分组的脚本
    const scriptData = [
      {
        endpoint: "GET /api/version-text",
        scripts: [
          { name: "获取版本信息", status: "positive" },
          { name: "请求缺少参数", status: "negative" },
          { name: "特殊字符输入", status: "exception" },
          { name: "超长字符串", status: "exception" },
          { name: "空值测试", status: "negative" },
          { name: "错误类型参数", status: "negative" },
          { name: "边界值测试", status: "positive" },
          { name: "并发请求", status: "positive" }
        ]
      },
      {
        endpoint: "POST /api/user/token",
        scripts: [
          { name: "正常登录", status: "positive" },
          { name: "密码错误", status: "negative" },
          { name: "账号不存在", status: "negative" },
          { name: "Token 过期", status: "exception" },
          { name: "多设备登录", status: "positive" }
        ]
      }
    ];

    function renderGroups() {
      const container = document.getElementById('scriptGroups');
      container.innerHTML = '';

      scriptData.forEach(group => {
        const positive = group.scripts.filter(s => s.status === 'positive').length;
        const negative = group.scripts.filter(s => s.status === 'negative').length;
        const exception = group.scripts.filter(s => s.status === 'exception').length;

        const groupEl = document.createElement('div');
        groupEl.className = 'script-group';

        groupEl.innerHTML = `
          <div class="group-header" onclick="toggleGroup(this)">
            <span>
              <i class="bi bi-chevron-down me-1 toggle-icon"></i>
              ${group.endpoint}
            </span>
            <span class="status-summary">
              ✅${positive} / ❌${negative} / ⚠️${exception}
            </span>
          </div>
          <div class="group-body" style="display:none;">
            ${group.scripts.map(script => `
              <div class="script-item">
                <div class="d-flex justify-content-between">
                  <strong>${script.name}</strong>
                  <span class="tag ${script.status}">${script.status}</span>
                </div>
                <div class="actions mt-1">
                  <button class="btn btn-outline-primary btn-sm"><i class="bi bi-play-circle"></i> 执行</button>
                  <button class="btn btn-outline-secondary btn-sm"><i class="bi bi-eye"></i> 详情</button>
                  <button class="btn btn-outline-secondary btn-sm"><i class="bi bi-bookmark"></i> 记录</button>
                </div>
              </div>
            `).join('')}
          </div>
        `;
        container.appendChild(groupEl);
      });
    }

    function toggleGroup(header) {
      const icon = header.querySelector('.toggle-icon');
      const body = header.nextElementSibling;
      const isExpanded = body.style.display === 'block';

      if (isExpanded) {
        body.style.display = 'none';
        icon.classList.replace('bi-chevron-up', 'bi-chevron-down');
      } else {
        body.style.display = 'block';
        icon.classList.replace('bi-chevron-down', 'bi-chevron-up');
      }
    }

    function toggleAllGroups(expand) {
      const bodies = document.querySelectorAll('.group-body');
      const icons = document.querySelectorAll('.toggle-icon');
      
      bodies.forEach((body, index) => {
        body.style.display = expand ? 'block' : 'none';
        const icon = icons[index];
        if (icon) {
          icon.className = icon.className.replace(/bi-chevron-(up|down)/g, 
            expand ? 'bi-chevron-up' : 'bi-chevron-down'
          );
        }
      });
    }

    // 初始化渲染
    document.addEventListener('DOMContentLoaded', renderGroups);
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
