<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>前端功能集成测试 - 字段映射</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h1 {
            color: #1890ff;
            margin-top: 0;
        }
        h2 {
            color: #333;
            border-bottom: 2px solid #1890ff;
            padding-bottom: 10px;
        }
        .test-section {
            margin-bottom: 30px;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-family: 'Consolas', monospace;
            font-size: 14px;
        }
        .pass {
            background-color: #f6ffed;
            border: 1px solid #b7eb8f;
            color: #52c41a;
        }
        .fail {
            background-color: #fff1f0;
            border: 1px solid #ffa39e;
            color: #ff4d4f;
        }
        .info {
            background-color: #e6f7ff;
            border: 1px solid #91d5ff;
            color: #1890ff;
        }
        button {
            background-color: #1890ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #40a9ff;
        }
        button:disabled {
            background-color: #d9d9d9;
            cursor: not-allowed;
        }
        pre {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            max-height: 300px;
            overflow-y: auto;
        }
        .summary {
            background-color: #fafafa;
            padding: 15px;
            border-radius: 4px;
            border-left: 4px solid #1890ff;
        }
        .config-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .config-item {
            margin-bottom: 10px;
        }
        .config-item label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .config-item input {
            width: 100%;
            padding: 8px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <h1>前端功能集成测试 - 字段映射</h1>
    
    <div class="container">
        <h2>测试配置</h2>
        <div class="config-section">
            <div class="config-item">
                <label>API 基础 URL</label>
                <input type="text" id="apiBaseUrl" value="http://localhost:8000/api/v1">
            </div>
            <div class="config-item">
                <label>项目 ID</label>
                <input type="number" id="projectId" value="1">
            </div>
            <div class="config-item">
                <label>版本 ID</label>
                <input type="number" id="versionId" value="1">
            </div>
            <div class="config-item">
                <label>认证 Token（可选）</label>
                <input type="text" id="authToken" placeholder="Bearer your_token_here">
            </div>
        </div>
    </div>

    <div class="container">
        <h2>测试控制</h2>
        <button onclick="runAllTests()">运行所有测试</button>
        <button onclick="clearResults()">清除结果</button>
        <button onclick="exportResults()">导出结果</button>
    </div>

    <div class="container">
        <h2>测试结果</h2>
        <div id="testResults"></div>
    </div>

    <div class="container">
        <h2>测试摘要</h2>
        <div id="testSummary" class="summary">
            <p>尚未运行测试</p>
        </div>
    </div>

    <script>
        // API 配置
        let apiBaseUrl = 'http://localhost:8000/api/v1';
        let projectId = 1;
        let versionId = 1;
        let authToken = '';

        // 测试结果存储
        let testResults = [];
        let testStartTime = null;

        // 创建的任务 ID
        let createdTaskId = null;

        /**
         * 更新配置
         */
        function updateConfig() {
            apiBaseUrl = document.getElementById('apiBaseUrl').value;
            projectId = parseInt(document.getElementById('projectId').value) || 1;
            versionId = parseInt(document.getElementById('versionId').value) || 1;
            authToken = document.getElementById('authToken').value;
        }

        /**
         * 获取请求头
         */
        function getHeaders() {
            const headers = {
                'Content-Type': 'application/json'
            };
            if (authToken) {
                headers['Authorization'] = authToken;
            }
            return headers;
        }

        /**
         * 发送 API 请求
         */
        async function apiRequest(method, endpoint, data = null) {
            const url = `${apiBaseUrl}${endpoint}`;
            const options = {
                method,
                headers: getHeaders()
            };
            if (data) {
                options.body = JSON.stringify(data);
            }
            
            const response = await fetch(url, options);
            return await response.json();
        }

        /**
         * 记录测试结果
         */
        function logTestResult(testName, passed, message) {
            const result = {
                testName,
                passed,
                message,
                timestamp: new Date().toISOString()
            };
            testResults.push(result);
            
            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${passed ? 'pass' : 'fail'}`;
            resultDiv.innerHTML = `
                <strong>${passed ? '✓ PASS' : '✗ FAIL'} - ${testName}</strong><br>
                ${message}
            `;
            document.getElementById('testResults').appendChild(resultDiv);
            
            updateSummary();
        }

        /**
         * 更新测试摘要
         */
        function updateSummary() {
            const total = testResults.length;
            const passed = testResults.filter(r => r.passed).length;
            const failed = total - passed;
            const passRate = total > 0 ? ((passed / total) * 100).toFixed(1) : 0;
            
            const summaryDiv = document.getElementById('testSummary');
            summaryDiv.innerHTML = `
                <p><strong>总测试数:</strong> ${total}</p>
                <p><strong>通过:</strong> ${passed}</p>
                <p><strong>失败:</strong> ${failed}</p>
                <p><strong>通过率:</strong> ${passRate}%</p>
                <p><strong>耗时:</strong> ${testStartTime ? `${Date.now() - testStartTime}ms` : '-'}</p>
            `;
        }

        /**
         * 清除测试结果
         */
        function clearResults() {
            testResults = [];
            testStartTime = null;
            createdTaskId = null;
            document.getElementById('testResults').innerHTML = '';
            updateSummary();
        }

        /**
         * 导出测试结果
         */
        function exportResults() {
            const summary = {
                config: {
                    apiBaseUrl,
                    projectId,
                    versionId,
                    hasAuthToken: !!authToken
                },
                total: testResults.length,
                passed: testResults.filter(r => r.passed).length,
                failed: testResults.filter(r => !r.passed).length,
                passRate: testResults.length > 0 ? ((testResults.filter(r => r.passed).length / testResults.length) * 100).toFixed(1) + '%' : '0%',
                results: testResults
            };
            
            const blob = new Blob([JSON.stringify(summary, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'test_integration_frontend_results.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        // ==================== 测试用例 ====================

        /**
         * 测试 1: 健康检查接口
         */
        async function testHealthCheck() {
            try {
                const data = await apiRequest('GET', '/health');
                
                if (data && data.status === 'ok') {
                    logTestResult('健康检查接口', true, `系统状态: ${data.status}`);
                } else {
                    logTestResult('健康检查接口', false, `响应状态: ${data?.status}`);
                }
            } catch (error) {
                logTestResult('健康检查接口', false, `请求失败: ${error.message}`);
            }
        }

        /**
         * 测试 2: 数据库连接池状态
         */
        async function testDbPoolStatus() {
            try {
                const data = await apiRequest('GET', '/health/db-pool');
                
                if (data && data.status && typeof data.utilization === 'number') {
                    logTestResult('数据库连接池状态', true, 
                        `状态: ${data.status}, 利用率: ${data.utilization}%, 健康度: ${data.health}`);
                } else {
                    logTestResult('数据库连接池状态', false, `响应格式错误`);
                }
            } catch (error) {
                logTestResult('数据库连接池状态', false, `请求失败: ${error.message}`);
            }
        }

        /**
         * 测试 3: 创建异步任务
         */
        async function testCreateAsyncTask() {
            try {
                const payload = {
                    project_id: projectId,
                    version_id: versionId,
                    config: {
                        include_paths: true,
                        include_query: true,
                        include_body: true,
                        use_ai: true,
                        ai_high_priority: true,
                        ai_medium_priority: true,
                        ai_low_priority: false
                    }
                };
                
                const data = await apiRequest('POST', '/async-tasks', payload);
                
                if (data && data.code === 0 && data.data) {
                    createdTaskId = data.data.task_id;
                    logTestResult('创建异步任务', true, `任务 ID: ${createdTaskId}`);
                } else {
                    logTestResult('创建异步任务', false, `创建失败: ${data?.message}`);
                }
            } catch (error) {
                logTestResult('创建异步任务', false, `请求失败: ${error.message}`);
            }
        }

        /**
         * 测试 4: 获取任务详情
         */
        async function testGetAsyncTask() {
            if (!createdTaskId) {
                logTestResult('获取任务详情', false, '没有可用的任务 ID');
                return;
            }
            
            try {
                const data = await apiRequest('GET', `/async-tasks/${createdTaskId}`);
                
                if (data && data.code === 0 && data.data) {
                    const task = data.data;
                    const requiredFields = ['id', 'status', 'progress', 'stages'];
                    const missingFields = requiredFields.filter(f => !(f in task));
                    
                    if (missingFields.length === 0) {
                        logTestResult('获取任务详情', true, 
                            `状态: ${task.status}, 进度: ${task.progress}%, 阶段数: ${task.stages?.length || 0}`);
                    } else {
                        logTestResult('获取任务详情', false, `缺少字段: ${missingFields.join(', ')}`);
                    }
                } else {
                    logTestResult('获取任务详情', false, `获取失败: ${data?.message}`);
                }
            } catch (error) {
                logTestResult('获取任务详情', false, `请求失败: ${error.message}`);
            }
        }

        /**
         * 测试 5: 获取任务列表
         */
        async function testListAsyncTasks() {
            try {
                const params = new URLSearchParams({
                    task_type: 'field_mapping_suggest',
                    project_id: projectId,
                    version_id: versionId,
                    limit: '10',
                    offset: '0'
                });
                
                const data = await apiRequest('GET', `/async-tasks?${params}`);
                
                if (data && data.code === 0 && data.data) {
                    const taskList = data.data;
                    logTestResult('获取任务列表', true, 
                        `总任务数: ${taskList.total || 0}, 返回: ${taskList.items?.length || 0} 条`);
                } else {
                    logTestResult('获取任务列表', false, `获取失败: ${data?.message}`);
                }
            } catch (error) {
                logTestResult('获取任务列表', false, `请求失败: ${error.message}`);
            }
        }

        /**
         * 测试 6: 任务轮询
         */
        async function testTaskPolling() {
            if (!createdTaskId) {
                logTestResult('任务轮询', false, '没有可用的任务 ID');
                return;
            }
            
            const maxWait = 30000; // 30 秒
            const interval = 3000; // 3 秒
            const startTime = Date.now();
            let pollCount = 0;
            
            try {
                while (Date.now() - startTime < maxWait) {
                    pollCount++;
                    const data = await apiRequest('GET', `/async-tasks/${createdTaskId}`);
                    
                    if (data && data.code === 0 && data.data) {
                        const task = data.data;
                        const status = task.status;
                        const progress = task.progress || 0;
                        
                        console.log(`轮询 #${pollCount}: 状态=${status}, 进度=${progress}%`);
                        
                        if (['completed', 'failed', 'cancelled'].includes(status)) {
                            logTestResult('任务轮询', true, 
                                `最终状态: ${status}, 轮询次数: ${pollCount}`);
                            return;
                        }
                    }
                    
                    await new Promise(resolve => setTimeout(resolve, interval));
                }
                
                logTestResult('任务轮询', false, `轮询超时（${maxWait}ms）`);
            } catch (error) {
                logTestResult('任务轮询', false, `请求失败: ${error.message}`);
            }
        }

        /**
         * 测试 7: 获取字段映射建议
         */
        async function testGetFieldMappingSuggestions() {
            if (!createdTaskId) {
                logTestResult('获取字段映射建议', false, '没有可用的任务 ID');
                return;
            }
            
            try {
                const data = await apiRequest('GET', `/async-tasks/${createdTaskId}/suggestions`);
                
                if (data && data.code === 0 && data.data) {
                    const suggestions = data.data;
                    const itemCount = suggestions.items?.length || 0;
                    logTestResult('获取字段映射建议', true, `建议数量: ${itemCount}`);
                } else {
                    logTestResult('获取字段映射建议', false, `获取失败: ${data?.message}`);
                }
            } catch (error) {
                logTestResult('获取字段映射建议', false, `请求失败: ${error.message}`);
            }
        }

        /**
         * 测试 8: 取消任务
         */
        async function testCancelAsyncTask() {
            if (!createdTaskId) {
                logTestResult('取消任务', false, '没有可用的任务 ID');
                return;
            }
            
            try {
                const data = await apiRequest('POST', `/async-tasks/${createdTaskId}/cancel`);
                
                if (data && data.code === 0) {
                    logTestResult('取消任务', true, `任务 ${createdTaskId} 已取消`);
                } else {
                    logTestResult('取消任务', false, `取消失败: ${data?.message}`);
                }
            } catch (error) {
                logTestResult('取消任务', false, `请求失败: ${error.message}`);
            }
        }

        /**
         * 测试 9: 数据缓存功能
         */
        async function testDataCaching() {
            try {
                const cacheKey = `test_cache_${Date.now()}`;
                const testData = { id: 1, name: 'test' };
                
                // 保存到缓存
                localStorage.setItem(cacheKey, JSON.stringify({
                    data: testData,
                    timestamp: Date.now()
                }));
                
                // 从缓存读取
                const cachedStr = localStorage.getItem(cacheKey);
                const cachedData = cachedStr ? JSON.parse(cachedStr) : null;
                
                if (cachedData && cachedData.data.id === testData.id) {
                    localStorage.removeItem(cacheKey);
                    logTestResult('数据缓存功能', true, '缓存读写正常');
                } else {
                    logTestResult('数据缓存功能', false, '缓存数据不匹配');
                }
            } catch (error) {
                logTestResult('数据缓存功能', false, `缓存操作失败: ${error.message}`);
            }
        }

        /**
         * 运行所有测试
         */
        async function runAllTests() {
            updateConfig();
            clearResults();
            testStartTime = Date.now();
            
            const infoDiv = document.createElement('div');
            infoDiv.className = 'test-result info';
            infoDiv.innerHTML = `<strong>开始运行测试... API: ${apiBaseUrl}</strong>`;
            document.getElementById('testResults').appendChild(infoDiv);
            
            // 执行测试
            await testHealthCheck();
            await testDbPoolStatus();
            await testCreateAsyncTask();
            await testGetAsyncTask();
            await testListAsyncTasks();
            await testDataCaching();
            
            // 可选测试（需要等待）
            // await testTaskPolling();
            // await testGetFieldMappingSuggestions();
            // await testCancelAsyncTask();
            
            const endTime = Date.now();
            testStartTime = endTime - testStartTime;
            updateSummary();
        }
    </script>
</body>
</html>
